*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:'Cairo',-apple-system,Roboto,Arial,sans-serif;background:#eef2f1;color:#111;direction:rtl;padding-bottom:70px}
header{background:#0f6b4d;color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px}.ttl{font-weight:bold;font-size:18px}.ttl small{display:block;font-weight:normal;opacity:.8;font-size:11px}
button.undo{background:rgba(255,255,255,.18);color:#fff;padding:8px 12px;font-size:14px}button.undo:disabled{opacity:.35}
.stats{display:flex;padding:4px 8px 8px}.stats div{flex:1;text-align:center}.stats b{display:block;font-size:20px}.stats span{font-size:11px;opacity:.85}
.card{background:#fff;margin:10px;border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}h3{margin:0 0 8px;font-size:15px;color:#0f6b4d}
#chat{height:110px;overflow:auto;background:#f1f5f4;border-radius:10px;padding:6px;margin-top:8px}#chat:after{content:"";display:block;clear:both}
.msg{padding:6px 10px;border-radius:12px;margin:4px 0;max-width:88%;font-size:14px;line-height:1.4;clear:both}.bot{background:#fff;float:right}.me{background:#0f6b4d;color:#fff;float:left}
.row{display:flex;gap:8px;margin-top:8px}input[type=text],input[type=search],select{font-family:inherit;flex:1;font-size:16px;padding:12px;border:1px solid #cfd8d5;border-radius:10px;min-width:0;background:#fff}
button{font-family:inherit;font-size:16px;padding:12px 14px;border:0;border-radius:10px;background:#0f6b4d;color:#fff;font-weight:600}button.g{background:#5b6b66;flex:1}button.red{background:#c62828}
button.mic{width:100%;font-size:21px;padding:18px;background:#c62828;border-radius:14px}button.mic.on{background:#111;animation:p 1s infinite}@keyframes p{50%{opacity:.6}}
.search{width:100%;margin-bottom:8px}.chips{display:flex;gap:6px;align-items:center;margin-bottom:6px}.chip{background:#e3e9e7;color:#333;padding:8px 14px;font-size:14px;border-radius:20px}.chip.on{background:#0f6b4d;color:#fff}#shown{font-size:12px;color:#777;margin-right:auto}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:#666;padding:4px}td{padding:8px 3px;border-bottom:1px solid #edf1f0;vertical-align:middle}
tr.done td.nm .n{color:#0f6b4d}tr.hit{background:#fff3b0}td.nm{width:auto}td.nm .n{font-size:16px;font-weight:600;display:block}td.nm small{display:block;color:#888;font-size:11px;margin-top:2px}td.nm small em{font-style:normal;background:#eef2f1;border-radius:4px;padding:0 5px}
td.cc{text-align:center;white-space:nowrap;width:100px}td.cc b{display:inline-block;min-width:30px;font-size:19px;padding:8px 0}
button.sm{padding:0;width:34px;height:44px;font-size:22px;background:#e3e9e7;color:#111;border-radius:10px}td.empty{text-align:center;color:#888;padding:24px 8px}
#photobox{display:none}canvas{width:100%;border-radius:10px;touch-action:manipulation}textarea{display:none;width:100%;height:80px;margin-top:6px}
.toast{position:fixed;bottom:14px;left:12px;right:12px;background:#222;color:#fff;border-radius:12px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;z-index:9;font-size:15px}.toast.show{display:flex}.toast button{background:#ffb300;color:#000;padding:6px 14px;font-size:14px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;align-items:center;justify-content:center}.modal.show{display:flex}.modal .box{background:#fff;border-radius:14px;padding:16px;width:90%;max-width:420px}.modal label{display:block;font-size:13px;color:#666;margin:8px 0 2px}.modal input{width:100%}

.brand{display:flex;align-items:center;gap:12px;padding:12px 12px 6px}.logo{flex:none;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.25)}.bn{flex:1}.name{font-size:34px;font-weight:800;line-height:1.1}.sub{font-size:11px;opacity:.85;margin-top:2px}

.name{font-family:'Reem Kufi','Cairo',sans-serif;font-weight:700}
body{line-height:1.3}button,input,select{line-height:1.2}.name{line-height:1.2}th{line-height:1.2}

tr.cat td{background:#66ffff;font-weight:800;font-size:15px;padding:8px 10px;color:#003;border-bottom:0}
i.un{font-style:normal;font-size:12px;color:#fff;background:#0f6b4d;border-radius:6px;padding:0 5px;margin-inline-start:3px;vertical-align:middle}
.row.dt{align-items:center}.row.dt label{font-size:12px;color:#666}.row.dt input{text-align:center;padding:10px 4px}
td.nm small{white-space:normal}
button.sm{width:28px;height:40px;font-size:20px;border-radius:8px}td.cc{width:84px}td.cc b{min-width:22px;font-size:17px;padding:8px 0}td{padding:7px 2px}td.nm .n{font-size:15px}.modal select{width:100%}
i.un{font-size:11px;padding:0 4px;margin-inline-start:2px}

function toast(t,withUndo){var b=$('toast');b.innerHTML='<span>'+esc(t)+'</span>'+(withUndo?'<button onclick="undo()">تراجع</button>':'');b.className='toast show';clearTimeout(toastT);toastT=setTimeout(function(){b.className='toast';},withUndo?6000:2500);}
function say(t,cls){var b=$('chat');var d=document.createElement('div');d.className='msg '+(cls||'bot');d.textContent=t;b.appendChild(d);b.scrollTop=b.scrollHeight;}
function counted(p){return (p.box||0)>0||(p.pc||0)>0;}
function colCss(c){return c==='FFFF00'?'#ffeb3b':c==='C6D9F0'?'#7fb2ea':c==='FDE9D9'?'#f4a9a0':'transparent';}
function cell(i,f){var p=rows[i],v=p[f]||0,u=f==='box'?'<i class="un" onclick="togUnit('+i+')">'+(p.bu||'ع')+'</i>':'';return '<td class="cc"><button class="sm" onclick="adj('+i+',\''+f+'\',-1)">−</button><b onclick="setVal('+i+',\''+f+'\')">'+v+u+'</b><button class="sm" onclick="adj('+i+',\''+f+'\',1)">+</button></td>';}
function render(){
  var h='',i,tb=0,tp=0,cn=0,n=0,shown=0,q=normAr(filterTxt),pendCat=null;
  for(i=0;i<rows.length;i++){var p=rows[i];
    if(p.cat){pendCat='<tr class="cat"><td colspan="3">'+esc(p.name)+'</td></tr>';continue;}
    n++;tb+=p.box||0;tp+=p.pc||0;if(counted(p))cn++;
    if(filterMode==='done'&&!counted(p))continue;if(filterMode==='todo'&&counted(p))continue;
    if(q&&normAr(p.name+' '+(p.note||''))!==''&&normAr(p.name+' '+(p.note||'')).indexOf(q)<0)continue;
    shown++;if(pendCat){h+=pendCat;pendCat=null;}
    var ex=p.exraw?p.exraw:(p.ex||'');
    h+='<tr id="r'+i+'" class="'+(counted(p)?'done':'')+'"><td class="nm" style="border-inline-start:6px solid '+colCss(p.col)+'" onclick="openEdit('+i+')"><span class="n">'+esc(p.name)+'</span><small>'+(ex?'EX '+esc(ex)+' ':'')+(p.note?'📝 '+esc(p.note):'')+'</small></td>'+cell(i,'box')+cell(i,'pc')+'</tr>';}
  if(!n)h='<tr><td colspan="3" class="empty">الزيارة فاضية.</td></tr>';else if(!shown)h='<tr><td colspan="3" class="empty">مفيش أصناف مطابقة.</td></tr>';
  $('rows').innerHTML=h;
  $('s_items').textContent=n;$('s_box').textContent=tb;$('s_pc').textContent=tp;$('s_done').textContent=cn+'/'+n;
  $('shown').textContent=(q||filterMode!=='all')?('معروض '+shown+' من '+n):'';
  fillSel();fillVisit();
}
function fillSel(){var h='',i,c='';for(i=0;i<rows.length;i++){if(rows[i].cat)c=rows[i].name;else h+='<option value="'+i+'">'+esc(rows[i].name)+'</option>';}$('psel').innerHTML=h;
  var k='<option value="-1">آخر الشيت</option>';for(i=0;i<rows.length;i++)if(rows[i].cat)k+='<option value="'+i+'">'+esc(rows[i].name)+'</option>';$('newcat').innerHTML=k;}
function fillVisit(){var h='',i;for(i=0;i<V.visits.length;i++)h+='<option value="'+i+'"'+(i===V.cur?' selected':'')+'>'+esc(V.visits[i].name)+' ('+V.visits[i].d+'/'+V.visits[i].m+'/'+V.visits[i].y+')</option>';$('vsel').innerHTML=h;var v=cv();$('v_d').value=v.d;$('v_m').value=v.m;$('v_y').value=v.y;}
function selVisit(i){V.cur=parseInt(i,10);rows=cv().rows;undoStack=[];$('undoBtn').disabled=true;save();render();}
function setDate(){var v=cv();v.d=parseInt(normDigits($('v_d').value),10)||v.d;v.m=parseInt(normDigits($('v_m').value),10)||v.m;v.y=parseInt(normDigits($('v_y').value),10)||v.y;save();render();}
function newVisit(){var t=new Date(),nr=JSON.parse(JSON.stringify(rows)),i;for(i=0;i<nr.length;i++){if(!nr[i].cat){nr[i].pc=0;nr[i].box=0;nr[i].ex='';nr[i].exraw='';}}
  V.visits.push({name:'زيارة '+(V.visits.length+1),d:t.getDate(),m:t.getMonth()+1,y:t.getFullYear(),rows:nr});V.cur=V.visits.length-1;rows=cv().rows;undoStack=[];save();render();toast('زيارة جديدة بنفس الأصناف والكميات صفر');}
function delVisit(){if(V.visits.length<2){toast('لازم تفضل زيارة واحدة على الأقل');return;}if(!confirm('مسح '+cv().name+'؟'))return;V.visits.splice(V.cur,1);V.cur=0;rows=cv().rows;save();render();}
function setFilter(m){filterMode=m;var b=document.querySelectorAll('.chip'),i;for(i=0;i<b.length;i++)b[i].className='chip'+(b[i].getAttribute('data-m')===m?' on':'');render();}
function onSearch(v){filterTxt=v;render();}
function adj(i,f,d){pushUndo();rows[i][f]=Math.max(0,(rows[i][f]||0)+d);save();render();}
function togUnit(i){pushUndo();rows[i].bu=rows[i].bu==='ك'?'ع':'ك';save();render();}
function setVal(i,f){var v=prompt('اكتب العدد ('+(f==='pc'?'قطعة':'علبة/كرتونة')+') لـ '+rows[i].name+':',rows[i][f]||0);if(v===null)return;v=parseFloat(normDigits(v));if(isNaN(v)||v<0){toast('رقم غير صحيح');return;}pushUndo();rows[i][f]=v;save();render();}
function flash(i){var r=$('r'+i);if(r){r.className+=' hit';setTimeout(function(){r.className=r.className.replace(' hit','');},1800);}}
function addCounts(text){
  var segs=parseUtterance(text), ok=[], bad=[], i, mode=$('mode').value, L=items();
  if(!segs.length){say('مفهمتش، قول اسم الصنف والعدد. مثال: "10 علب ارز".');return;}
  pushUndo();var changed=false;
  for(i=0;i<segs.length;i++){
    var s=segs[i];
    if(s.qty===null){bad.push(s.phrase+' (من غير عدد)');continue;}
    var m=matchProduct(s.phrase,L);
    if(m.idx<0){bad.push('"'+s.phrase+'"'+(m.cands.length&&m.score>0.3?' (يمكن '+L[m.cands[0].idx].name+'؟)':''));continue;}
    var p=L[m.idx], f=(s.unit==='قطعة')?'pc':'box', ul=f==='pc'?'قطعة':(s.unit==='كرتونة'?'كرتونة':'علبة');
    if(s.unit==='كرتونة')p.bu='ك';else if(s.unit==='علبة')p.bu='ع';
    p[f]=mode==='set'?s.qty:(p[f]||0)+s.qty;ok.push(p.name+' ← '+s.qty+' '+ul);changed=true;
  }
  if(!changed){undoStack.pop();$('undoBtn').disabled=!undoStack.length;}
  save();render();
  if(ok.length){say((mode==='set'?'ظبطت: ':'ضفت: ')+ok.join('، '));toast('تم: '+ok.length+' صنف',true);}
  if(bad.length)say('مش متأكد من: '+bad.join('، ')+'. اكتب اسم الصنف زي ما في الشيت.');
}
function sendText(){var t=$('txt').value;if(!t.replace(/\s/g,''))return;say(t,'me');$('txt').value='';addCounts(t);}
var rec=null,listening=false;
function setMic(on){listening=on;var b=$('mic');b.className=on?'mic on':'mic';b.innerHTML=on?'⏹ بسمعك... اضغط للإيقاف':'🎤 اضغط واتكلم';}
function startVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say('المتصفح ده مش بيدعم الميكروفون المباشر. افتح الرابط في Chrome، أو اكتب الجملة.');$('txt').focus();return;}
  if(listening&&rec){try{rec.stop();}catch(e){}return;}
  rec=new SR();rec.lang='ar-EG';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onresult=function(e){var t=e.results[0][0].transcript;$('txt').value=t;sendText();};
  rec.onerror=function(e){var m=e&&e.error;if(m==='not-allowed'||m==='service-not-allowed')say('الميكروفون مقفول. اسمح للموقع باستخدام الميكروفون من إعدادات المتصفح وجرّب تاني.');else if(m==='no-speech')say('مسمعتش حاجة، جرّب تاني.');else say('الميكروفون مشتغلش ('+(m||'?')+'). ممكن تكتب الجملة.');};
  rec.onend=function(){setMic(false);};
  try{rec.start();setMic(true);}catch(e){say('مقدرتش أشغل الميكروفون.');setMic(false);}
}
function addProd(){var n=$('newname').value.replace(/^\s+|\s+$/g,'');if(!n){toast('اكتب اسم الصنف الأول');return;}
  var i;for(i=0;i<rows.length;i++){if(!rows[i].cat&&normAr(rows[i].name)===normAr(n)){toast('الصنف ده موجود بالفعل');return;}}
  pushUndo();var np={name:n,pc:0,box:0,bu:'ع',ex:'',exraw:'',col:'',note:''},c=parseInt($('newcat').value,10),at=rows.length;
  if(c>=0){at=c+1;while(at<rows.length&&!rows[at].cat)at++;}
  rows.splice(at,0,np);$('newname').value='';save();render();flash(at);toast('اتضاف: '+n,true);}
function openEdit(i){editIdx=i;var p=rows[i];$('e_name').value=p.name;$('e_ex').value=p.ex||'';$('e_exraw').value=p.exraw||'';$('e_note').value=p.note||'';$('e_col').value=p.col||'';$('modal').className='modal show';}
function closeEdit(){$('modal').className='modal';editIdx=-1;}
function saveEdit(){var p=rows[editIdx];var n=$('e_name').value.replace(/^\s+|\s+$/g,'');if(!n){toast('الاسم مطلوب');return;}pushUndo();p.name=n;p.ex=$('e_ex').value;p.exraw=$('e_exraw').value;p.note=$('e_note').value;p.col=$('e_col').value;p._norm=null;save();render();closeEdit();toast('اتحفظ',true);}
function delEdit(){var p=rows[editIdx];if(!confirm('مسح "'+p.name+'"؟ (تقدر تتراجع بعدها)'))return;pushUndo();rows.splice(editIdx,1);save();render();closeEdit();toast('اتمسح',true);}
function resetCounts(){if(!confirm('تصفير كل الكميات في الزيارة دي؟ (تقدر تتراجع بعدها)'))return;pushUndo();for(var i=0;i<rows.length;i++){rows[i].box=0;rows[i].pc=0;}save();render();toast('اتصفّرت الكميات',true);}
function resetAll(){if(!confirm('ده هيمسح كل الزيارات ويرجّع شيت أبو عوف الأصلي. متأكد؟'))return;initFresh();undoStack=[];save();render();toast('رجع الشيت الأصلي');}
// photo counting by tapping
function onPhoto(f){
  if(!f)return;var rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){
    var c=$('cv'),W=Math.min(im.width,900),H=Math.round(im.height*W/im.width);c.width=W;c.height=H;lastPhoto=im;dots=[];draw();$('photobox').style.display='block';
    say('الصورة جاهزة. اضغط على كل عنصر في الصورة عشان تتعد، وبعدين اختار الصنف واضغط "ضيف".');};im.src=rd.result;};
  rd.readAsDataURL(f);
}
function draw(){var c=$('cv'),x=c.getContext('2d');x.drawImage(lastPhoto,0,0,c.width,c.height);x.font='bold 22px sans-serif';
  for(var i=0;i<dots.length;i++){x.fillStyle='rgba(220,30,30,.85)';x.beginPath();x.arc(dots[i][0],dots[i][1],15,0,6.3);x.fill();x.fillStyle='#fff';x.textAlign='center';x.fillText(String(i+1),dots[i][0],dots[i][1]+8);}
  $('pcount').textContent=dots.length;}
function tapPhoto(e){var c=$('cv'),r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;var x=(t.clientX-r.left)*c.width/r.width,y=(t.clientY-r.top)*c.height/r.height;dots.push([x,y]);draw();e.preventDefault&&e.preventDefault();}
function undoDot(){dots.pop();draw();}
function addPhoto(){var i=parseInt($('psel').value,10);if(isNaN(i)||!dots.length)return;var F=$('punit').value;pushUndo();var p=rows[i];p[F]=$('mode').value==='set'?dots.length:(p[F]||0)+dots.length;save();render();flash(i);say('من الصورة: '+p.name+' ← '+dots.length+' '+(F==='pc'?'قطعة':'علبة/كرتونة'));toast('تم من الصورة',true);dots=[];draw();}
// import / export (Abu Awf layout)
function toIso(c){var v=c&&c.v;if(typeof v==='number'&&v>20000){var d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().substring(0,10);}return '';}
function parseCount(v){var o={pc:0,box:0,bu:null};if(v===null||v===undefined||v==='')return o;return o;}
function cnt(c){ // returns {n,unit}
  var v=c&&c.v;if(v===null||v===undefined||v==='')return {n:0,u:''};
  if(typeof v==='number')return {n:v,u:''};
  var s=normDigits(String(v)),m=/\d+(\.\d+)?/.exec(s);return {n:m?parseFloat(m[0]):0,u:/ق/.test(s)?'ق':(/ك/.test(s)?'ك':(/ع/.test(s)?'ع':''))};}
function sheetToVisit(sh,idx){
  var R=sh.rows,keys=Object.keys(R).map(Number).sort(function(a,b){return a-b;}),hr=-1,i;
  for(i=0;i<keys.length;i++){var r=R[keys[i]];if(r.B&&String(r.B.v||'').indexOf('قطع')>=0){hr=keys[i];break;}}
  if(hr<0)return null;
  var dr=R[hr-1]||{},d=+(dr.B&&dr.B.v)||0,m=+(dr.C&&dr.C.v)||0,y=+(dr.D&&dr.D.v)||0,t=new Date();
  var out=[],k;
  for(k=0;k<keys.length;k++){var rn=keys[k];if(rn<=hr)continue;var r2=R[rn],a=r2.A;if(!a||a.v===null||String(a.v).replace(/\s/g,'')==='')continue;
    var name=String(a.v).replace(/^\s+|\s+$/g,'');
    if(a.fill==='66FFFF'){out.push({cat:1,name:name});continue;}
    var b=cnt(r2.B),c=cnt(r2.C),p={name:name,pc:0,box:0,bu:'ع',ex:'',exraw:'',col:(a.fill==='FFFF00'||a.fill==='C6D9F0'||a.fill==='FDE9D9')?a.fill:'',note:''};
    if(b.n){if(b.u==='ع'||b.u==='ك'){p.box+=b.n;p.bu=b.u;}else p.pc+=b.n;}
    if(c.n){if(c.u==='ق')p.pc+=c.n;else{p.box+=c.n;if(c.u==='ك')p.bu='ك';}}
    var dd=r2.D;if(dd&&dd.v!==null&&dd.v!==undefined&&dd.v!==''){var iso=toIso(dd);if(iso)p.ex=iso;else p.exraw=String(dd.v);}
    out.push(p);}
  return {name:(/^[\s\S]*$/.test(sh.name)&&sh.name)||('زيارة '+(idx+1)),d:d||t.getDate(),m:m||t.getMonth()+1,y:y||t.getFullYear(),rows:out};
}
function onFile(f){
  if(!f)return;var rd=new FileReader();
  rd.onload=function(){XL.unzip(new Uint8Array(rd.result)).then(function(files){
    var sheets=XL.readBook(files),vs=[],i;
    for(i=0;i<sheets.length;i++){var v=sheetToVisit(sheets[i],i);if(v&&v.rows.length)vs.push(v);}
    if(!vs.length){say('الملف ده مش بنفس شكل شيت أبو عوف (لازم عمود "قطعة" و"علبة/كرتونة").');return;}
    if(!confirm('هيستبدل الزيارات الحالية بـ '+vs.length+' زيارة من الملف. متأكد؟'))return;
    V={visits:vs,cur:0};rows=cv().rows;undoStack=[];$('undoBtn').disabled=true;save();render();
    var n=vs[0].rows.filter(function(r){return !r.cat;}).length;say('استوردت '+vs.length+' زيارة. أول زيارة فيها '+n+' صنف.');
  }).catch(function(){say('مقدرتش أقرا الملف. لازم يكون Excel (xlsx).');});};
  rd.readAsArrayBuffer(f);
}
function dlXlsx(){try{var u=XL.write(V.visits),b=new Blob([u],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='abuawf-inventory.xlsx';document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);},500);}catch(e){say('التحميل المباشر مش شغال على المتصفح ده. استخدم "بعت بالايميل".');}}
function mail(){var s='Item Description\tقطعة\tعلبة/كرتونة\tEX\n',i;for(i=0;i<rows.length;i++){var p=rows[i];if(p.cat){s+=p.name+'\n';continue;}if(counted(p)||p.ex||p.exraw)s+=p.name+'\t'+(p.pc||'')+'\t'+(p.box?p.box+(p.bu||'ع'):'')+'\t'+(p.exraw||p.ex||'')+'\n';}
  location.href='mailto:?subject='+encodeURIComponent('جرد '+cv().name)+'&body='+encodeURIComponent(s);}
window.onload=function(){if(load()){rows=cv().rows;render();say('أهلا! الأرقام اتحفظت من المرة اللي فاتت.');}else{initFresh();render();say('أهلا! حملت شيت أبو عوف: '+items().length+' صنف. جرّب: "5 علب سادة فاتح 200جم و 3 قطع".');}
  $('undoBtn').disabled=true;undoStack=[];
  $('txt').onkeydown=function(e){if(e.keyCode===13){e.preventDefault();sendText();}};
  var c=$('cv');c.addEventListener('click',tapPhoto,false);};
</script></body></html>
