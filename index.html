<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جرد بالصوت والصورة (تجريبي)</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Arial,sans-serif;background:#f3f5f7;color:#111;direction:rtl}

<header>جرد بالصوت والصورة<small>نسخة تجريبية - الأرقام بتتحفظ على التليفون</small></header>

<script src="xlsx.js"></script><script>// Arabic text -> [{name, qty}] ; ES5 only
var AR_DIG = '٠١٢٣٤٥٦٧٨٩', FA_DIG = '۰۱۲۳۴۵۶۷۸۹';
function normDigits(s){
  return String(s).replace(/[٠-٩]/g,function(c){return AR_DIG.indexOf(c);}).replace(/[۰-۹]/g,function(c){return FA_DIG.indexOf(c);}).replace(/٫|٬/g,'');
}
function normAr(s){
  s = normDigits(s).toLowerCase();
  s = s.replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
  s = s.replace(/[^a-z0-9\u0621-\u064A\s\.]/g,' ').replace(/\s+/g,' ').replace(/^ | $/g,'');
  return s;
}
var UNITS = {'صفر':0,'واحد':1,'واحده':1,'اتنين':2,'اثنين':2,'اتنتين':2,'تلاته':3,'ثلاثه':3,'تلات':3,'اربعه':4,'اربع':4,'خمسه':5,'خمس':5,'سته':6,'ست':6,'سبعه':7,'سبع':7,'تمانيه':8,'ثمانيه':8,'تمن':8,'تسعه':9,'تسع':9,'عشره':10,'عشر':10,'احداشر':11,'اطناشر':12,'اتناشر':12,'تلاتاشر':13,'تلتاشر':13,'اربعتاشر':14,'خمستاشر':15,'خمسطاشر':15,'ستاشر':16,'سبعتاشر':17,'تمنتاشر':18,'تسعتاشر':19,
 'عشرين':20,'تلاتين':30,'ثلاثين':30,'اربعين':40,'خمسين':50,'ستين':60,'سبعين':70,'تمانين':80,'ثمانين':80,'تسعين':90,
 'ميه':100,'مايه':100,'مئه':100,'ميت':100,'مائه':100,'تلتمايه':300,'تلتميه':300,'ربعميه':400,'خمسميه':500,'ستميه':600,'سبعميه':700,'تمنميه':800,'تسعميه':900,'الف':1000,'دستتين':24,'دستة':12,'دسته':12,'نص':0.5,'نصف':0.5};
var NUMWORDS = UNITS;
function wordNum(w){ // handles optional leading "و" attached e.g. واحد
  if (NUMWORDS.hasOwnProperty(w)) return NUMWORDS[w];
  return null;
}
function lev(a,b){
  var m=a.length,n=b.length,i,j,d=[],c;
  if(!m) return n; if(!n) return m;
  for(i=0;i<=m;i++){d[i]=[i];}
  for(j=1;j<=n;j++){d[0][j]=j;}
  for(i=1;i<=m;i++){for(j=1;j<=n;j++){c=a.charAt(i-1)===b.charAt(j-1)?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);}}
  return d[m][n];
}
function stripAl(w){return w.length>3 && w.indexOf('ال')===0 ? w.substring(2) : w;}
var UNITW={'علبه':'علبة','علب':'علبة','علبتين':'علبة','قطعه':'قطعة','قطع':'قطعة','قطعتين':'قطعة'};
var FILLER = {'عندنا':1,'عندي':1,'في':1,'فيه':1,'يوجد':1,'العدد':1,'عدد':1,'كرتونه':1,'كراتين':1,'حته':1,'كيس':1,'اكياس':1,'زجاجه':1,'زجاجات':1,'وحده':1,'وحدات':1,'من':1,'ده':1,'دي':1,'كمان':1,'تقريبا':1,'حوالي':1,'يعني':1,'ضيف':1,'سجل':1,'اكتب':1};
function tokSim(a,b){
  if(a===b) return 1;
  var A=stripAl(a),B=stripAl(b);
  if(A===B) return 1;
  if(A.length>=3&&B.length>=3&&(A.indexOf(B)===0||B.indexOf(A)===0)) return 0.9;
  var L=Math.max(A.length,B.length);
  if(L<3) return 0;
  var s=1-lev(A,B)/L;
  return s>=0.65?s:0;
}
function matchProduct(phrase, products){
  var q=normAr(phrase).split(' ').filter(function(w){return w&&!FILLER[w];});
  if(!q.length) return {idx:-1,score:0,cands:[]};
  var res=[],i,j,k;
  for(i=0;i<products.length;i++){
    var p=products[i], pt=(p._norm||(p._norm=normAr(p.name+' '+(p.code||'')))).split(' ').filter(Boolean);
    var tot=0;
    for(j=0;j<q.length;j++){var best=0;for(k=0;k<pt.length;k++){var s=tokSim(q[j],pt[k]);if(s>best)best=s;}tot+=best;}
    var cover=tot/q.length, ptCover=0;
    // reward products whose own tokens are all mentioned
    for(k=0;k<pt.length;k++){var b2=0;for(j=0;j<q.length;j++){var s2=tokSim(q[j],pt[k]);if(s2>b2)b2=s2;}ptCover+=b2;}
    ptCover=ptCover/pt.length;
    res.push({idx:i,score:cover*0.7+ptCover*0.3});
  }
  res.sort(function(a,b){return b.score-a.score;});
  return {idx:res[0].score>=0.55?res[0].idx:-1,score:res[0].score,cands:res.slice(0,3)};
}
// Token stream -> segments. Patterns: "qty name" or "name qty".
function parseUtterance(text){
  var parts = normDigits(text).split(/[\n،,;\.]+/), out=[], pi;
  for(pi=0;pi<parts.length;pi++){
    var toks = normAr(parts[pi]).split(' ').filter(Boolean), T=[], j, w, w2, n;
    for(j=0;j<toks.length;j++){
      w=toks[j];
      if(/^[0-9]+(\.[0-9]+)?$/.test(w)){T.push({t:'N',v:parseFloat(w)});continue;}
      if(UNITW.hasOwnProperty(w)){ if(w==='علبتين'||w==='قطعتين')T.push({t:'N',v:2}); T.push({t:'U',v:UNITW[w]}); continue; }
      if(w==='و'||w==='بعدين'||w==='وبعدها'){T.push({t:'S'});continue;}
      n=wordNum(w);
      if(n===null && w.length>2 && w.charAt(0)==='و'){ w2=w.substring(1); n=wordNum(w2); if(n!==null){T.push({t:'S'});T.push({t:'N',v:n});continue;} }
      if(n!==null){T.push({t:'N',v:n});continue;}
      if(FILLER[w]) continue;
      T.push({t:'W',v:w});
    }
    var seg=null, mode=null;
    var pendU=null;
    function flush(){ if(seg&&(seg.words.length||seg.qty!==null)) out.push({phrase:seg.words.join(' '),qty:seg.qty,unit:seg.unit||null,raw:seg.words.join(' ')}); seg=null; mode=null; }
    for(j=0;j<T.length;j++){
      var k=T[j];
      if(k.t==='U'){ if(seg) seg.unit=k.v; else pendU=k.v; continue; }
      if(k.t==='S'){
        // separator: continues a number only if next is number and we are in qty phase
        var nx=T[j+1];
        if(seg && seg.lastType==='N' && nx && nx.t==='N') continue;
        if(seg && seg.lastType==='N' && mode==='name' ) { flush(); }
        else if(seg && seg.lastType==='W' && mode==='qty' && seg.qty!==null && seg.words.length){ flush(); }
        continue;
      }
      if(!seg){ seg={words:[],qty:null,lastType:null,unit:pendU}; pendU=null; mode = k.t==='N'?'qty':'name'; }
      if(k.t==='N'){
        if(mode==='qty' && seg.words.length){ flush(); seg={words:[],qty:null,lastType:null,unit:null}; mode='qty'; }
        else if(mode==='name' && seg.qty!==null && seg.lastType!=='N'){ flush(); seg={words:[],qty:null,lastType:null,unit:null}; mode='qty'; }
        seg.qty=(seg.qty===null?0:seg.qty)+k.v; seg.lastType='N';
      } else {
        if(mode==='name' && seg.qty!==null){ flush(); seg={words:[],qty:null,lastType:null,unit:null}; mode='name'; }
        seg.words.push(k.v); seg.lastType='W';
      }
    }
    flush();
  }
  return out;
}
if(typeof module!=='undefined') module.exports={normAr:normAr,parseUtterance:parseUtterance,matchProduct:matchProduct};
</script><script>var products=[], cols={}, wb=null, lastPhoto=null, dots=[], pending=[];
var SAMPLE=['شاي ليبتون','سكر أبيض','أرز مصري','زيت عباد الشمس','مكرونة اسباجتي','لبن بودرة','صلصة طماطم','بسكويت','عصير مانجو','مياه معدنية','فول معلب','تونة','جبنة رومي','حمص الشام','عدس أصفر','ملح طعام','صابون سائل','منظف أطباق','مناديل ورقية','شامبو'];
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function save(){try{localStorage.setItem('inv3',JSON.stringify({p:products}));}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem('inv3'));if(d&&d.p&&d.p.length){products=d.p;return true;}}catch(e){}return false;}
function useSample(){products=SAMPLE.map(function(n,i){return {name:n,code:'',box:0,pc:0};});save();render();say('حملت شيت تجريبي فيه '+products.length+' صنف. جرّب تقول: "5 علب شاي و 3 قطع زيت".');}
function say(t,cls){var b=$('chat');var d=document.createElement('div');d.className='msg '+(cls||'bot');d.textContent=t;b.appendChild(d);b.scrollTop=b.scrollHeight;}
function cell(i,f){var v=products[i][f]||0;return '<td class="cc"><button class="sm" onclick="adj('+i+',\''+f+'\',1)">+</button><b>'+v+'</b><button class="sm" onclick="adj('+i+',\''+f+'\',-1)">-</button></td>';}
function render(){
  var h='',i,tb=0,tp=0;
  for(i=0;i<products.length;i++){var p=products[i];tb+=p.box||0;tp+=p.pc||0;
    h+='<tr id="r'+i+'"><td class="nm">'+esc(p.name)+'<small><button class="sm s2" onclick="editP('+i+')">✎</button><button class="sm s2" onclick="delP('+i+')">🗑</button></small></td>'+cell(i,'box')+cell(i,'pc')+'</tr>';}
  $('rows').innerHTML=h; $('tot').textContent=products.length+' صنف - الإجمالي: '+tb+' علبة، '+tp+' قطعة'; fillSel();
}
function adj(i,f,d){products[i][f]=Math.max(0,(products[i][f]||0)+d);save();render();}
function fillSel(){var h='',i;for(i=0;i<products.length;i++)h+='<option value="'+i+'">'+esc(products[i].name)+'</option>';$('psel').innerHTML=h;}
function flash(i){var r=$('r'+i);if(r){r.className='hit';setTimeout(function(){r.className='';},1800);}}
function addCounts(text){
  var segs=parseUtterance(text), ok=[], bad=[], i;
  if(!segs.length){say('مفهمتش، قول اسم الصنف والعدد. مثال: "10 ارز".');return;}
  var mode=$('mode').value;
  for(i=0;i<segs.length;i++){
    var s=segs[i];
    if(s.qty===null){bad.push(s.phrase+' (من غير عدد)');continue;}
    var m=matchProduct(s.phrase,products);
    if(m.idx<0){bad.push('"'+s.phrase+'"'+(m.cands.length&&m.score>0.3?' (يمكن '+products[m.cands[0].idx].name+'؟)':''));continue;}
    var p=products[m.idx]; var f=(s.unit==='قطعة')?'pc':'box'; var ul=f==='pc'?'قطعة':'علبة';
    p[f] = mode==='set'? s.qty : (p[f]||0)+s.qty; ok.push(p.name+' ← '+s.qty+' '+ul); flash(m.idx);
  }
  save();render();
  if(ok.length)say((mode==='set'?'ظبطت: ':'ضفت: ')+ok.join('، '));
  if(bad.length)say('مش متأكد من: '+bad.join('، ')+'. اكتب اسم الصنف زي ما في الشيت.');
}
function sendText(){var t=$('txt').value;if(!t.replace(/\s/g,''))return;say(t,'me');$('txt').value='';addCounts(t);}
var rec=null,listening=false;
function setMic(on){listening=on;var b=$('mic');b.className=on?'mic on':'mic';b.innerHTML=on?'⏹ بسمعك... اضغط للإيقاف':'🎤 اضغط واتكلم';}
function startVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say('المتصفح ده مش بيدعم الميكروفون المباشر. افتح الرابط في Chrome، أو اكتب الجملة.');$('txt').focus();return;}
  if(listening&&rec){try{rec.stop();}catch(e){}return;}
  rec=new SR();rec.lang='ar-EG';rec.interimResults=false;rec.maxAlternatives=1;var got=false;

  rec.onerror=function(e){var m=e&&e.error;if(m==='not-allowed'||m==='service-not-allowed')say('الميكروفون مقفول. اسمح للموقع باستخدام الميكروفون من إعدادات المتصفح وجرّب تاني.');else if(m==='no-speech')say('مسمعتش حاجة، جرّب تاني.');else say('الميكروفون مشتغلش ('+(m||'?')+'). ممكن تكتب الجملة.');};
  rec.onend=function(){setMic(false);if(!got){}};
  try{rec.start();setMic(true);}catch(e){say('مقدرتش أشغل الميكروفون.');setMic(false);}
}
// photo counting by tapping
function onPhoto(f){
  if(!f)return;var rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){
    var c=$('cv'),W=Math.min(im.width,900),H=Math.round(im.height*W/im.width);c.width=W;c.height=H;lastPhoto=im;dots=[];draw();$('photobox').style.display='block';
    say('الصورة جاهزة. اضغط على كل عنصر في الصورة عشان تتعد، وبعدين اختار الصنف واضغط "ضيف".');};im.src=rd.result;};
  rd.readAsDataURL(f);
}
function draw(){var c=$('cv'),x=c.getContext('2d');x.drawImage(lastPhoto,0,0,c.width,c.height);x.font='bold 22px sans-serif';
  for(var i=0;i<dots.length;i++){x.fillStyle='rgba(220,30,30,.85)';x.beginPath();x.arc(dots[i][0],dots[i][1],15,0,6.3);x.fill();x.fillStyle='#fff';x.textAlign='center';x.fillText(String(i+1),dots[i][0],dots[i][1]+8);}
  $('pcount').textContent=dots.length;}
function tapPhoto(e){var c=$('cv'),r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;var x=(t.clientX-r.left)*c.width/r.width,y=(t.clientY-r.top)*c.height/r.height;dots.push([x,y]);draw();e.preventDefault&&e.preventDefault();}
function undoDot(){dots.pop();draw();}
function addPhoto(){var i=parseInt($('psel').value,10);if(isNaN(i)||!dots.length)return;var F=$('punit').value;var p=products[i];p[F]=$('mode').value==='set'?dots.length:(p[F]||0)+dots.length;save();render();flash(i);say('من الصورة: '+p.name+' ← '+dots.length+' '+(F==='pc'?'قطعة':'علبة'));dots=[];draw();}
// import / export
function onFile(f){
  if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{
    wb=XLSX.read(rd.result,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(rows.length<2){say('الشيت فاضي.');return;}
    var hdr=rows[0].map(function(x){return normAr(String(x));}),ni=-1,bi=-1,pi=-1,ci=-1,ki=-1,i;
    for(i=0;i<hdr.length;i++){var h=hdr[i];
      if(ni<0&&/(اسم|صنف|منتج|بيان|name|item|product)/.test(h))ni=i;
      else if(bi<0&&/(علب|علبه|box)/.test(h))bi=i;
      else if(pi<0&&/(قطع|piece|pcs)/.test(h))pi=i;
      else if(ci<0&&/(كميه|عدد|جرد|رصيد|qty|count|stock)/.test(h))ci=i;
      else if(ki<0&&/(كود|رقم|code|sku)/.test(h))ki=i;}
    if(ni<0)ni=0; if(bi<0&&ci>=0)bi=ci;

  }catch(e){say('مقدرتش أقرا الملف. لازم يكون Excel (xlsx).');}};

function buildWb(){
  var rows=[['الصنف','الكود','علب','قطعة']],i;for(i=0;i<products.length;i++)rows.push([products[i].name,products[i].code||'',products[i].box||0,products[i].pc||0]);
  var w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet(rows),'الجرد');return w;
}
function csvText(){var s='\ufeffالصنف,الكود,علب,قطعة\n',i;for(i=0;i<products.length;i++){var p=products[i];s+='"'+p.name.replace(/"/g,'""')+'",'+(p.code||'')+','+(p.box||0)+','+(p.pc||0)+'\n';}return s;}
function dlXlsx(){try{XLSX.writeFile(buildWb(),'inventory.xlsx');}catch(e){say('التحميل المباشر مش شغال على المتصفح ده. استخدم "بعت بالايميل" أو "انسخ الجدول".');}}
function mail(){var b=csvText().replace(/^\ufeff/,'');location.href='mailto:?subject='+encodeURIComponent('جرد')+'&body='+encodeURIComponent(b);}
function copyTbl(){var t=$('copybox');t.style.display='block';var s='',i;for(i=0;i<products.length;i++)s+=products[i].name+'\t'+(products[i].box||0)+'\t'+(products[i].pc||0)+'\n';t.value=s;t.focus();t.select();try{t.setSelectionRange(0,99999);document.execCommand('copy');say('نسخت الجدول، الصقه في أي شيت.');}catch(e){say('حدد النص واضغط نسخ.');}}
function resetCounts(){if(!confirm('تصفير كل الكميات؟'))return;for(var i=0;i<products.length;i++)products[i].box=0;products[i].pc=0;save();render();say('صفّرت الكميات.');}
window.onload=function(){if(!load())useSample();else{render();say('أهلا! الأرقام اتحفظت من المرة اللي فاتت.');}
  $('txt').onkeydown=function(e){if(e.keyCode===13){e.preventDefault();sendText();}};
  var c=$('cv');c.addEventListener('click',tapPhoto,false);};

function addProd(){var n=$('newname').value.replace(/^\s+|\s+$/g,'');if(!n){say('اكتب اسم الصنف الأول.');return;}
  products.push({name:n,code:'',box:0,pc:0});$('newname').value='';save();render();flash(products.length-1);say('ضفت الصنف: '+n);}
function editP(i){var p=products[i];var n=prompt('اسم الصنف:',p.name);if(n===null)return;n=n.replace(/^\s+|\s+$/g,'');if(!n)return;p.name=n;p._norm=null;save();render();}
function delP(i){if(!confirm('مسح "'+products[i].name+'"؟'))return;products.splice(i,1);save();render();}
function clearAll(){if(!confirm('مسح كل الأصناف؟'))return;products=[];save();render();say('الشيت فاضي. ضيف أصنافك من فوق.');}
</script></body></html>
