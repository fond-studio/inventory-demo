var AR_DIG = '٠١٢٣٤٥٦٧٨٩', FA_DIG = '۰۱۲۳۴۵۶۷۸۹';

  var m=a.length,n=b.length,i,j,d=[],c;

var FILLER = {'عندنا':1,'عندي':1,'في':1,'فيه':1,'يوجد':1,'العدد':1,'عدد':1,'كرتونه':1,'كراتين':1,'حته':1,'كيس':1,'اكياس':1,'زجاجه':1,'زجاجات':1,'وحده':1,'وحدات':1,'من':1,'ده':1,'دي':1,'كمان':1,'تقريبا':1,'حوالي':1,'يعني':1,'ضيف':1,'سجل':1,'اكتب':1};
function tokSim(a,b){
  if(a===b) return 1;
  var A=stripAl(a),B=stripAl(b);
  if(A===B) return 1;
  if(A.length>=3&&B.length>=3&&(A.indexOf(B)===0||B.indexOf(A)===0)) return 0.9;
  var L=Math.max(A.length,B.length);
  if(L<3) return 0;
  var s=1-lev(A,B)/L;
  return s>=0.65?s:0;
}
function matchProduct(phrase, products){
  var q=normAr(phrase).split(' ').filter(function(w){return w&&!FILLER[w];});
  if(!q.length) return {idx:-1,score:0,cands:[]};
  var res=[],i,j,k;
  for(i=0;i<products.length;i++){
    var p=products[i], pt=(p._norm||(p._norm=normAr(p.name+' '+(p.code||'')))).split(' ').filter(Boolean);
    var tot=0;
    for(j=0;j<q.length;j++){var best=0;for(k=0;k<pt.length;k++){var s=tokSim(q[j],pt[k]);if(s>best)best=s;}tot+=best;}
    var cover=tot/q.length, ptCover=0;
    // reward products whose own tokens are all mentioned
    for(k=0;k<pt.length;k++){var b2=0;for(j=0;j<q.length;j++){var s2=tokSim(q[j],pt[k]);if(s2>b2)b2=s2;}ptCover+=b2;}
    ptCover=ptCover/pt.length;
    res.push({idx:i,score:cover*0.7+ptCover*0.3});
  }
  res.sort(function(a,b){return b.score-a.score;});
  return {idx:res[0].score>=0.55?res[0].idx:-1,score:res[0].score,cands:res.slice(0,3)};
}
// Token stream -> segments. Patterns: "qty name" or "name qty".
function parseUtterance(text){
  var parts = normDigits(text).split(/[\n،,;\.]+/), out=[], pi;
  for(pi=0;pi<parts.length;pi++){
    var toks = normAr(parts[pi]).split(' ').filter(Boolean), T=[], j, w, w2, n;
    for(j=0;j<toks.length;j++){
      w=toks[j];
      if(/^[0-9]+(\.[0-9]+)?$/.test(w)){T.push({t:'N',v:parseFloat(w)});continue;}
      if(UNITW.hasOwnProperty(w)){ if(w==='علبتين'||w==='قطعتين')T.push({t:'N',v:2}); T.push({t:'U',v:UNITW[w]}); continue; }
      if(w==='و'||w==='بعدين'||w==='وبعدها'){T.push({t:'S'});continue;}
      n=wordNum(w);
      if(n===null && w.length>2 && w.charAt(0)==='و'){ w2=w.substring(1); n=wordNum(w2); if(n!==null){T.push({t:'S'});T.push({t:'N',v:n});continue;} }
      if(n!==null){T.push({t:'N',v:n});continue;}
      if(FILLER[w]) continue;
      T.push({t:'W',v:w});
    }
    var seg=null, mode=null;
    var pendU=null;
    function flush(){ if(seg&&(seg.words.length||seg.qty!==null)) out.push({phrase:seg.words.join(' '),qty:seg.qty,unit:seg.unit||null,raw:seg.words.join(' ')}); seg=null; mode=null; }
    for(j=0;j<T.length;j++){
      var k=T[j];
      if(k.t==='U'){ if(seg) seg.unit=k.v; else pendU=k.v; continue; }
      if(k.t==='S'){
        // separator: continues a number only if next is number and we are in qty phase
        var nx=T[j+1];
        if(seg && seg.lastType==='N' && nx && nx.t==='N') continue;
        if(seg && seg.lastType==='N' && mode==='name' ) { flush(); }
        else if(seg && seg.lastType==='W' && mode==='qty' && seg.qty!==null && seg.words.length){ flush(); }
        continue;
      }
      if(!seg){ seg={words:[],qty:null,lastType:null,unit:pendU}; pendU=null; mode = k.t==='N'?'qty':'name'; }
      if(k.t==='N'){
        if(mode==='qty' && seg.words.length){ flush(); seg={words:[],qty:null,lastType:null,unit:null}; mode='qty'; }
        else if(mode==='name' && seg.qty!==null && seg.lastType!=='N'){ flush(); seg={words:[],qty:null,lastType:null,unit:null}; mode='qty'; }
        seg.qty=(seg.qty===null?0:seg.qty)+k.v; seg.lastType='N';
      } else {
        if(mode==='name' && seg.qty!==null){ flush(); seg={words:[],qty:null,lastType:null,unit:null}; mode='name'; }
        seg.words.push(k.v); seg.lastType='W';
      }
    }
    flush();
  }
  return out;
}

</script><script>var products=[], cols={}, wb=null, lastPhoto=null, dots=[], pending=[];

function save(){try{localStorage.setItem('inv3',JSON.stringify({p:products}));}catch(e){}}

function useSample(){products=SAMPLE.map(function(n,i){return {name:n,code:'',box:0,pc:0};});save();render();say('حملت شيت تجريبي فيه '+products.length+' صنف. جرّب تقول: "5 علب شاي و 3 قطع زيت".');}
function say(t,cls){var b=$('chat');var d=document.createElement('div');d.className='msg '+(cls||'bot');d.textContent=t;b.appendChild(d);b.scrollTop=b.scrollHeight;}
function cell(i,f){var v=products[i][f]||0;return '<td class="cc"><button class="sm" onclick="adj('+i+',\''+f+'\',1)">+</button><b>'+v+'</b><button class="sm" onclick="adj('+i+',\''+f+'\',-1)">-</button></td>';}
function render(){
  var h='',i,tb=0,tp=0;
  for(i=0;i<products.length;i++){var p=products[i];tb+=p.box||0;tp+=p.pc||0;
    h+='<tr id="r'+i+'"><td class="nm">'+esc(p.name)+'<small><button class="sm s2" onclick="editP('+i+')">✎</button><button class="sm s2" onclick="delP('+i+')">🗑</button></small></td>'+cell(i,'box')+cell(i,'pc')+'</tr>';}
  $('rows').innerHTML=h; $('tot').textContent=products.length+' صنف - الإجمالي: '+tb+' علبة، '+tp+' قطعة'; fillSel();

function adj(i,f,d){products[i][f]=Math.max(0,(products[i][f]||0)+d);save();render();}

function addCounts(text){
  var segs=parseUtterance(text), ok=[], bad=[], i;

function sendText(){var t=$('txt').value;if(!t.replace(/\s/g,''))return;say(t,'me');$('txt').value='';addCounts(t);}
var rec=null,listening=false;
function setMic(on){listening=on;var b=$('mic');b.className=on?'mic on':'mic';b.innerHTML=on?'⏹ بسمعك... اضغط للإيقاف':'🎤 اضغط واتكلم';}
function startVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say('المتصفح ده مش بيدعم الميكروفون المباشر. افتح الرابط في Chrome، أو اكتب الجملة.');$('txt').focus();return;}

  rec.onerror=function(e){var m=e&&e.error;if(m==='not-allowed'||m==='service-not-allowed')say('الميكروفون مقفول. اسمح للموقع باستخدام الميكروفون من إعدادات المتصفح وجرّب تاني.');else if(m==='no-speech')say('مسمعتش حاجة، جرّب تاني.');else say('الميكروفون مشتغلش ('+(m||'?')+'). ممكن تكتب الجملة.');};

}
// photo counting by tapping
function onPhoto(f){
  if(!f)return;var rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){
    var c=$('cv'),W=Math.min(im.width,900),H=Math.round(im.height*W/im.width);c.width=W;c.height=H;lastPhoto=im;dots=[];draw();$('photobox').style.display='block';
    say('الصورة جاهزة. اضغط على كل عنصر في الصورة عشان تتعد، وبعدين اختار الصنف واضغط "ضيف".');};im.src=rd.result;};
  rd.readAsDataURL(f);

function draw(){var c=$('cv'),x=c.getContext('2d');x.drawImage(lastPhoto,0,0,c.width,c.height);x.font='bold 22px sans-serif';
  for(var i=0;i<dots.length;i++){x.fillStyle='rgba(220,30,30,.85)';x.beginPath();x.arc(dots[i][0],dots[i][1],15,0,6.3);x.fill();x.fillStyle='#fff';x.textAlign='center';x.fillText(String(i+1),dots[i][0],dots[i][1]+8);}

function addPhoto(){var i=parseInt($('psel').value,10);if(isNaN(i)||!dots.length)return;var F=$('punit').value;var p=products[i];p[F]=$('mode').value==='set'?dots.length:(p[F]||0)+dots.length;save();render();flash(i);say('من الصورة: '+p.name+' ← '+dots.length+' '+(F==='pc'?'قطعة':'علبة'));dots=[];draw();}
// import / export
function onFile(f){

  rd.onload=function(){try{
    wb=XLSX.read(rd.result,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});

    for(i=0;i<hdr.length;i++){var h=hdr[i];

      else if(bi<0&&/(علب|علبه|box)/.test(h))bi=i;
      else if(pi<0&&/(قطع|piece|pcs)/.test(h))pi=i;
      else if(ci<0&&/(كميه|عدد|جرد|رصيد|qty|count|stock)/.test(h))ci=i;
